```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    .box {
      text-align: center;
      padding: 30px;
    }

    .icon {
      font-size: 50px;
      margin-bottom: 15px;
    }

    h2 {
      margin: 0 0 10px;
    }

    p {
      margin: 0;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="box">
    <div class="icon">📱</div>
    <h2>Redirecting...</h2>
    <p>Please wait.</p>
  </div>

  <script>
    const ua = navigator.userAgent.toLowerCase();

    // iPhone / iPad
    const isApple =
      /iphone|ipad|ipod/.test(ua) ||
      (navigator.platform === "macintel" && navigator.maxTouchPoints > 1);

    // Android
    const isAndroid = /android/.test(ua);

    if (isApple) {
      // iPhone → YouTube
      window.location.replace("https://www.youtube.com/");

    } else if (isAndroid) {
      // Android → Google
      window.location.replace("https://www.google.com/");

    } else {
      // Desktop → Google
      window.location.replace("https://www.google.com/");
    }
  </script>

</body>
</html>
```

<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Download Our App</title> <style> * { box-sizing: border-box; margin: 0; padding: 0; } body { min-height: 100vh; display: flex; justify-content: center; align-items: center; font-family: Arial, sans-serif; background: #f5f5f5; color: #222; } .container { width: 90%; max-width: 450px; padding: 40px 25px; text-align: center; background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); } .icon { font-size: 60px; margin-bottom: 20px; } h1 { font-size: 28px; margin-bottom: 12px; } p { color: #666; line-height: 1.6; margin-bottom: 25px; } .button { display: inline-block; padding: 14px 25px; border-radius: 10px; background: #111; color: white; text-decoration: none; font-weight: bold; transition: 0.2s; } .button:hover { opacity: 0.85; } .status { font-size: 14px; color: #888; margin-top: 20px; } </style> </head> <body> <div class="container"> <div class="icon">📱</div> <h1>Get Our App</h1> <p id="message"> We're taking you to the right app store... </p> <a id="downloadButton" class="button" href="#" > Download App </a> <div id="status" class="status"> Detecting your device... </div> </div> <script> // ========================================== // CHANGE THESE TWO URLS // ========================================== const PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=com.example.app"; const APP_STORE_URL = "https://apps.apple.com/app/id123456789"; // ========================================== // DEVICE DETECTION // ========================================== const userAgent = navigator.userAgent || navigator.vendor || window.opera; const button = document.getElementById("downloadButton"); const message = document.getElementById("message"); const status = document.getElementById("status"); // Android if (/android/i.test(userAgent)) { message.textContent = "You are using Android. Redirecting you to Google Play..."; status.textContent = "Android device detected"; button.href = PLAY_STORE_URL; button.textContent = "Get it on Google Play"; // Redirect after 1.5 seconds setTimeout(() => { window.location.href = PLAY_STORE_URL; }, 1500); // iPhone / iPad / iPod } else if ( /iPad|iPhone|iPod/.test(userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1) ) { message.textContent = "You are using an Apple device. Redirecting you to the App Store..."; status.textContent = "iPhone / iPad detected"; button.href = APP_STORE_URL; button.textContent = "Download on the App Store"; // Redirect after 1.5 seconds setTimeout(() => { window.location.href = APP_STORE_URL; }, 1500); // Desktop / unknown device } else { message.textContent = "Please scan this QR code using your phone to download the app."; status.textContent = "Desktop or unsupported device"; button.style.display = "none"; } </script> </body> </html>
